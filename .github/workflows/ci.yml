name: ci

on:
  push:
    branches: [main]
  pull_request:

# A second push to a PR makes the first run's result irrelevant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # A Windows checkout has no exec bit to lose, so a mode dropped from the index
  # is invisible locally and only shows up here as a bare "exit code 126".
  # Both of these are invoked as ./path by CI and by semantic-release.
  exec-bits:
    name: exec bits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Scripts invoked directly must be executable
        run: |
          status=0
          for f in plugin/gradlew release/build-jar.sh; do
            if [ -x "$f" ]; then
              echo "ok   $f"
            else
              echo "::error file=$f::$f is not executable, so running it gives exit code 126." \
                "Fix with: git update-index --chmod=+x $f"
              status=1
            fi
          done
          exit $status

  plugin:
    name: plugin (Java 11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Java 11: the client runs on it, and build.gradle pins release 11. Building
      # on a newer JDK would let through API that the client's JVM cannot load.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "11"
          cache: gradle

      - name: Test
        working-directory: plugin
        run: ./gradlew --no-daemon test

      # Build through the very script the release runs, at the version already
      # declared, so the release path is exercised on every PR: the version
      # rewrite, the exact-filename assertion, the checksum. `semantic-release
      # --dry-run` cannot cover any of it — dry runs skip prepare and publish
      # outright — and a release that only breaks at prepare breaks after the
      # version has already been computed.
      - name: Build jar through the release path
        run: release/build-jar.sh "$(sed -n "s/^version = '\(.*\)'\$/\1/p" plugin/build.gradle)"

      # Named for the PR so a reviewer can sideload the exact build under review.
      - uses: actions/upload-artifact@v5
        with:
          name: runelite-mcp-server-plugin-${{ github.sha }}
          path: plugin/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

  server:
    name: companion server (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install
        working-directory: server
        run: npm ci

      - name: Typecheck
        working-directory: server
        run: npm run typecheck

      - name: Test
        working-directory: server
        run: npm test

  # Versioning is driven by the merged PR's label (see CONTRIBUTING.md), so a PR
  # without one would merge and release nothing. Catch it while it is still open.
  version-label:
    name: version label
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Require exactly one of major, minor, patch
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          matched=$(jq -r '.[] | select(. == "major" or . == "minor" or . == "patch")' <<< "$LABELS")
          count=$(grep -c . <<< "$matched" || true)

          if [ "$count" -eq 1 ]; then
            echo "Release type: $matched"
            exit 0
          fi

          if [ "$count" -eq 0 ]; then
            echo "::error::This PR has no version label. Add exactly one of 'major', 'minor' or 'patch' —" \
              "merging is what cuts the release, and an unlabelled merge releases nothing."
          else
            echo "::error::This PR has more than one version label ($(tr '\n' ' ' <<< "$matched"))." \
              "Keep exactly one, so the release type is unambiguous."
          fi
          exit 1

  # The release workflow runs semantic-release from this config, so a typo in it
  # would otherwise only surface at merge, with review closed and the PR gone.
  #
  # Deliberately not `semantic-release --dry-run`: that calls verifyAuth
  # unconditionally — a real `git push --dry-run` — even in dry-run mode, so it
  # needs a write-capable token. A job that runs on pull requests, forks
  # included, must not have one. verify-config.mjs checks what actually breaks
  # instead: the config parsing, every plugin resolving, and the label shim.
  release-config:
    name: release config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install release tooling
        run: npm ci

      - name: Verify the release config
        run: npm run verify:release
