name: ci

on:
  push:
    branches: [main]
  pull_request:

# A second push to a PR makes the first run's result irrelevant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plugin:
    name: plugin (Java 11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Java 11: the client runs on it, and build.gradle pins release 11. Building
      # on a newer JDK would let through API that the client's JVM cannot load.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: gradle

      - name: Test
        working-directory: plugin
        run: ./gradlew --no-daemon test

      - name: Build jar
        working-directory: plugin
        run: ./gradlew --no-daemon jar

      # Named for the PR so a reviewer can sideload the exact build under review.
      - uses: actions/upload-artifact@v4
        with:
          name: runelite-mcp-server-plugin-${{ github.sha }}
          path: plugin/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

  server:
    name: companion server (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install
        working-directory: server
        run: npm ci

      - name: Typecheck
        working-directory: server
        run: npm run typecheck

      - name: Test
        working-directory: server
        run: npm test

  # Versioning is driven by the merged PR's label (see CONTRIBUTING.md), so a PR
  # without one would merge and release nothing. Catch it while it is still open.
  version-label:
    name: version label
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Require exactly one of major, minor, patch
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          matched=$(jq -r '.[] | select(. == "major" or . == "minor" or . == "patch")' <<< "$LABELS")
          count=$(grep -c . <<< "$matched" || true)

          if [ "$count" -eq 1 ]; then
            echo "Release type: $matched"
            exit 0
          fi

          if [ "$count" -eq 0 ]; then
            echo "::error::This PR has no version label. Add exactly one of 'major', 'minor' or 'patch' —" \
              "merging is what cuts the release, and an unlabelled merge releases nothing."
          else
            echo "::error::This PR has more than one version label ($(tr '\n' ' ' <<< "$matched"))." \
              "Keep exactly one, so the release type is unambiguous."
          fi
          exit 1

  # The release workflow runs semantic-release from this config; a typo in it
  # would only surface at merge, after review has closed. Parse it here instead.
  release-config:
    name: release config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install release tooling
        run: npm ci

      # Loads .releaserc.json and resolves every plugin, including the local
      # label-release-type shim, so a typo in the release config fails here
      # rather than at merge. Config is validated before semantic-release decides
      # whether to release, and it never does here: on a PR it recognises the PR
      # and stops, and on main RELEASE_TYPE is unset so the type is "no release".
      # Deliberately not --no-ci, which would bypass that PR detection and then
      # fail on the branch check instead.
      - name: Dry-run semantic-release
        run: npx semantic-release --dry-run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
