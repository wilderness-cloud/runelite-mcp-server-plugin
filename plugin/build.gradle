plugins {
	id 'java'
}

repositories {
	mavenLocal()
	maven {
		url = 'https://repo.runelite.net'
		content {
			includeGroupByRegex("net\\.runelite.*")
		}
	}
	mavenCentral()
}

// Pinned, not 'latest.release': a shipped build must be reproducible, and the
// API we compile against sets the oldest client this plugin can run on.
def runeLiteVersion = '1.12.39'
def pluginMainClass = 'com.runelitemc.bridge.McpServerPluginTest'

dependencies {
	compileOnly group: 'net.runelite', name:'client', version: runeLiteVersion

	compileOnly 'org.projectlombok:lombok:1.18.30'
	annotationProcessor 'org.projectlombok:lombok:1.18.30'

	testImplementation 'junit:junit:4.12'
	testImplementation group: 'net.runelite', name:'client', version: runeLiteVersion
	testImplementation group: 'net.runelite', name:'jshell', version: runeLiteVersion
}

group = 'com.runelitemc'
version = '0.1.0'

/**
 * Stamps the jar with the commit it was built from. A sideloaded plugin is
 * whatever jar is in the sideload directory and the version string does not
 * move between builds, so without this the only way to tell a current jar from
 * a stale one is to diff the schemas it serves. client_status reports these.
 */
def gitOutput = { String... argv ->
	try {
		def out = new ByteArrayOutputStream()
		def result = exec {
			commandLine argv
			standardOutput = out
			errorOutput = new ByteArrayOutputStream()
			ignoreExitValue = true
			workingDir = rootDir
		}
		return result.exitValue == 0 ? out.toString("UTF-8").trim() : null
	}
	catch (Exception ignored) {
		return null // no git, or not a checkout: the stamp degrades to "dev"
	}
}

def buildInfoDir = layout.buildDirectory.dir("generated/build-info")

tasks.register('buildInfo') {
	def outDir = buildInfoDir
	def declaredVersion = project.version.toString()
	outputs.dir(outDir)
	// Never up-to-date: the SHA and the dirty flag can change without any
	// input Gradle tracks changing.
	outputs.upToDateWhen { false }

	doLast {
		def sha = gitOutput('git', 'rev-parse', '--short', 'HEAD')
		def status = gitOutput('git', 'status', '--porcelain')
		def build = sha == null ? 'dev' : (status ? sha + '-dirty' : sha)
		def builtAt = java.time.Instant.now().truncatedTo(java.time.temporal.ChronoUnit.SECONDS).toString()

		def dir = outDir.get().asFile
		dir.mkdirs()
		// 'version' rides along so the release number lives in exactly one place
		// (this file) rather than being retyped into every class that reports it.
		def body = ["version=${declaredVersion}", "build=${build}", "builtAt=${builtAt}", ""]
			.join(System.lineSeparator())
		new File(dir, 'build-info.properties').text = body
		logger.lifecycle("build stamp: ${declaredVersion} ${build} @ ${builtAt}")
	}
}

sourceSets.main.resources.srcDir(buildInfoDir)
tasks.named('processResources') {
	dependsOn 'buildInfo'
	// Only the plugin manifest is templated. Filtering every resource would run
	// the JSON tool schemas through Groovy's ${} expansion and mangle them.
	filesMatching('runelite-plugin.properties') {
		expand(version: project.version)
	}
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release.set(11)
}

tasks.named('test') {
	// BuildInfoTest pins the release version to what the plugin reports as its
	// MCP serverInfo.version; it needs the declared version to compare against.
	systemProperty 'declaredVersion', project.version.toString()
}

tasks.register('run', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = pluginMainClass

	jvmArgs "-ea"
	args "--developer-mode", "--debug"
}

// No fat-jar task on purpose. The shipped artifact is the plain `jar`: this
// plugin compiles against the client but bundles nothing, which is what keeps it
// clear of the child-first-classloader ClassCastException trap and means the
// release contains no third-party code to relicense or re-attribute. A fat jar
// built from the test runtime classpath would package RuneLite's own client jar
// inside a release asset, which is redistribution nobody here intends.
