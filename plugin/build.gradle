plugins {
	id 'java'
}

repositories {
	mavenLocal()
	maven {
		url = 'https://repo.runelite.net'
		content {
			includeGroupByRegex("net\\.runelite.*")
		}
	}
	mavenCentral()
}

// Pinned, not 'latest.release': a shipped build must be reproducible, and the
// API we compile against sets the oldest client this plugin can run on.
def runeLiteVersion = '1.12.39'
def pluginMainClass = 'com.runelitemc.bridge.GielinorCompanionPluginTest'

dependencies {
	compileOnly group: 'net.runelite', name:'client', version: runeLiteVersion

	compileOnly 'org.projectlombok:lombok:1.18.30'
	annotationProcessor 'org.projectlombok:lombok:1.18.30'

	testImplementation 'junit:junit:4.12'
	testImplementation group: 'net.runelite', name:'client', version: runeLiteVersion
	testImplementation group: 'net.runelite', name:'jshell', version: runeLiteVersion
}

group = 'com.runelitemc'
version = '0.1.0'

/**
 * Stamps the jar with the commit it was built from. A sideloaded plugin is
 * whatever jar is in the sideload directory and the version string does not
 * move between builds, so without this the only way to tell a current jar from
 * a stale one is to diff the schemas it serves. client_status reports these.
 */
def gitOutput = { String... argv ->
	try {
		def out = new ByteArrayOutputStream()
		def result = exec {
			commandLine argv
			standardOutput = out
			errorOutput = new ByteArrayOutputStream()
			ignoreExitValue = true
			workingDir = rootDir
		}
		return result.exitValue == 0 ? out.toString("UTF-8").trim() : null
	}
	catch (Exception ignored) {
		return null // no git, or not a checkout: the stamp degrades to "dev"
	}
}

def buildInfoDir = layout.buildDirectory.dir("generated/build-info")

tasks.register('buildInfo') {
	def outDir = buildInfoDir
	outputs.dir(outDir)
	// Never up-to-date: the SHA and the dirty flag can change without any
	// input Gradle tracks changing.
	outputs.upToDateWhen { false }

	doLast {
		def sha = gitOutput('git', 'rev-parse', '--short', 'HEAD')
		def status = gitOutput('git', 'status', '--porcelain')
		def build = sha == null ? 'dev' : (status ? sha + '-dirty' : sha)
		def builtAt = java.time.Instant.now().truncatedTo(java.time.temporal.ChronoUnit.SECONDS).toString()

		def dir = outDir.get().asFile
		dir.mkdirs()
		def body = ["build=${build}", "builtAt=${builtAt}", ""].join(System.lineSeparator())
		new File(dir, 'build-info.properties').text = body
		logger.lifecycle("build stamp: ${build} @ ${builtAt}")
	}
}

sourceSets.main.resources.srcDir(buildInfoDir)
tasks.named('processResources') { dependsOn 'buildInfo' }

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release.set(11)
}

tasks.register('run', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = pluginMainClass

	jvmArgs "-ea"
	args "--developer-mode", "--debug"
}

tasks.register('shadowJar', Jar) {
	dependsOn configurations.testRuntimeClasspath
	manifest {
		attributes('Main-Class': pluginMainClass, 'Multi-Release': true)
	}

	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	from sourceSets.main.output
	from sourceSets.test.output
	from {
		configurations.testRuntimeClasspath.collect { file ->
			file.isDirectory() ? file : zipTree(file)
		}
	}

	exclude 'META-INF/INDEX.LIST'
	exclude 'META-INF/*.SF'
	exclude 'META-INF/*.DSA'
	exclude 'META-INF/*.RSA'
	exclude '**/module-info.class'

	group = BasePlugin.BUILD_GROUP
	archiveClassifier.set('shadow')
	archiveFileName.set("${rootProject.name}-${project.version}-all.jar")
}
